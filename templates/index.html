<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iran Channel Summarizer</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!-- Auth Modal -->
  <div id="auth-modal" class="modal hidden">
    <div class="modal-box">
      <h2>Telegram Login</h2>
      <p>Authenticate with your Telegram account to start reading channels.</p>

      <div id="auth-step-phone">
        <label>Phone number (with country code)</label>
        <input id="auth-phone" type="text" placeholder="+61..." />
        <button onclick="sendCode()">Send Code</button>
        <p id="auth-phone-error" class="error"></p>
      </div>

      <div id="auth-step-code" class="hidden">
        <label>Verification code</label>
        <input id="auth-code" type="text" placeholder="12345" />
        <div id="auth-2fa-row" class="hidden">
          <label>2FA Password</label>
          <input id="auth-password" type="password" placeholder="Cloud password" />
        </div>
        <button onclick="verifyCode()">Verify</button>
        <p id="auth-code-error" class="error"></p>
      </div>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" class="hidden">
    <header>
      <div class="header-left">
        <h1>Iran Channel Summarizer</h1>
        <span id="last-updated" class="muted"></span>
      </div>
      <div class="header-right">
        <button id="refresh-btn" onclick="triggerRefresh()">Refresh Now</button>
      </div>
    </header>

    <div class="layout">

      <!-- Sidebar: Channel Management -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Channels</h2>
        </div>

        <div class="add-channel-row">
          <input id="channel-input" type="text" placeholder="@channel or t.me/..." />
          <button id="add-btn" onclick="addChannel()">Add</button>
          <span id="add-error" class="error"></span>
        </div>

        <ul id="channel-list" class="channel-list"></ul>
        <p id="channel-empty" class="muted sidebar-empty hidden">No channels yet.</p>
      </aside>

      <!-- Main: Summaries -->
      <main>
        <div id="summaries-grid"></div>
        <div id="empty-state" class="hidden">
          <p>Add a channel on the left to get started.</p>
        </div>
      </main>

    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
