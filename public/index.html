<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iran Channel Summarizer</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- Session error banner (shown only if Telegram session is invalid) -->
  <div id="session-error" class="hidden">
    <div class="error-banner">
      Telegram session invalid — re-run <code>python setup_auth.py</code> and update the
      <strong>TELEGRAM_SESSION</strong> environment variable in Netlify.
    </div>
  </div>

  <!-- Main App -->
  <div id="app" class="hidden">
    <header>
      <div class="header-left">
        <h1>Iran Channel Summarizer</h1>
        <span id="last-updated" class="muted"></span>
        <span id="next-refresh" class="muted"></span>
      </div>
      <div class="header-right">
        <button id="refresh-btn" onclick="triggerRefresh()">Refresh Now</button>
      </div>
    </header>

    <div class="layout">

      <!-- Sidebar: Channel Management -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Channels</h2>
        </div>

        <div class="add-channel-row">
          <input id="channel-input" type="text" placeholder="@channel or t.me/..." />
          <button id="add-btn" onclick="addChannel()">Add</button>
          <span id="add-error" class="error"></span>
        </div>

        <ul id="channel-list" class="channel-list"></ul>
        <p id="channel-empty" class="muted sidebar-empty hidden">No channels yet.</p>
      </aside>

      <!-- Main: Summaries -->
      <main>
        <div id="summaries-grid"></div>
        <div id="empty-state" class="hidden">
          <p>Add a channel on the left to get started.</p>
        </div>
      </main>

    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
