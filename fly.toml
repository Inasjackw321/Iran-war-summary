# Fly.io configuration
# Deploy with: fly deploy
# Set secrets with: fly secrets set TELEGRAM_API_ID=... (see README section below)

app = "iran-channel-summarizer"   # change to your unique app name
primary_region = "syd"            # Sydney — closest to Australia (+61 phone)

[build]

[env]
  DATA_DIR = "/data"

[[mounts]]
  source      = "summarizer_data"
  destination = "/data"

[http_service]
  internal_port = 5000
  force_https   = true
  auto_stop_machines  = false   # keep running for the scheduler
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
