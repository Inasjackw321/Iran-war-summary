<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Channel Summarizer</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!-- Auth modal — shown only on first launch before Telegram login -->
  <div id="auth-modal" class="modal hidden">
    <div class="modal-box">
      <h2>Connect Telegram</h2>
      <p>Sign in once to let the app read your channels.</p>

      <div id="step-phone">
        <label>Phone number (with country code)</label>
        <input id="auth-phone" type="tel" placeholder="+61..." autocomplete="tel" />
        <button onclick="sendCode()">Send Code</button>
        <p id="err-phone" class="error"></p>
      </div>

      <div id="step-code" class="hidden">
        <label>Telegram verification code</label>
        <input id="auth-code" type="text" placeholder="12345" inputmode="numeric" />
        <div id="step-2fa" class="hidden">
          <label>Two-factor password</label>
          <input id="auth-2fa" type="password" placeholder="Cloud password" />
        </div>
        <button onclick="verifyCode()">Verify</button>
        <button class="btn-secondary" onclick="resetAuth()">← Back</button>
        <p id="err-code" class="error"></p>
      </div>
    </div>
  </div>

  <!-- Main dashboard -->
  <div id="app" class="hidden">
    <header>
      <div>
        <h1>Channel Summarizer</h1>
        <span id="last-updated" class="muted"></span>
      </div>
      <button id="btn-refresh" onclick="triggerRefresh()">Refresh Now</button>
    </header>

    <div class="layout">

      <aside class="sidebar">
        <p class="sidebar-label">Channels</p>

        <div class="add-row">
          <input id="ch-input" type="text" placeholder="@channel or t.me/…" />
          <button id="btn-add" onclick="addChannel()">Add</button>
        </div>
        <p id="err-add" class="error"></p>

        <ul id="ch-list"></ul>
        <p id="ch-empty" class="muted hidden">No channels yet.</p>
      </aside>

      <main>
        <div id="grid"></div>
        <p id="main-empty" class="center-msg hidden">Add a channel on the left to get started.</p>
      </main>

    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
