<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iran Channel Summaries</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
    }

    header {
      background: #1a1d2e;
      border-bottom: 1px solid #2d3148;
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #a78bfa;
      letter-spacing: 0.02em;
    }

    #meta {
      font-size: 0.8rem;
      color: #64748b;
    }

    main {
      max-width: 960px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    #loading {
      text-align: center;
      padding: 4rem;
      color: #64748b;
      font-size: 1.1rem;
    }

    #error-msg {
      display: none;
      background: #2d1f1f;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: #1a1d2e;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      transition: border-color 0.2s;
    }

    .card:hover { border-color: #a78bfa; }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .card-title {
      font-weight: 700;
      font-size: 1rem;
      color: #c4b5fd;
    }

    .card-handle {
      font-size: 0.75rem;
      color: #64748b;
      text-decoration: none;
    }

    .card-handle:hover {
      color: #a78bfa;
      text-decoration: underline;
    }

    .card-meta {
      font-size: 0.72rem;
      color: #475569;
    }

    .card-body {
      font-size: 0.88rem;
      line-height: 1.65;
      color: #cbd5e1;
      white-space: pre-wrap;
    }

    .badge {
      display: inline-block;
      font-size: 0.68rem;
      padding: 0.2em 0.55em;
      border-radius: 9999px;
      font-weight: 600;
    }

    .badge-ok  { background: #14532d; color: #86efac; }
    .badge-err { background: #450a0a; color: #fca5a5; }

    .empty {
      text-align: center;
      padding: 4rem;
      color: #475569;
    }

    @media (max-width: 540px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <h1>Iran Channel Summaries</h1>
  <span id="meta">Loading…</span>
</header>

<main>
  <div id="error-msg"></div>
  <div id="loading">Fetching summaries…</div>
  <div class="grid" id="grid" style="display:none"></div>
  <div class="empty" id="empty" style="display:none">
    No summaries yet. The GitHub Action will populate this on its next run.
  </div>
</main>

<script>
  const REFRESH_MS = 30 * 60 * 1000; // 30 minutes

  function fmt(iso) {
    if (!iso) return "—";
    const d = new Date(iso);
    return d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
  }

  function renderCard(ch) {
    const err = ch.error;
    return `
      <div class="card">
        <div class="card-header">
          <span class="card-title">${esc(ch.display_name)}</span>
          <span class="badge ${err ? "badge-err" : "badge-ok"}">${err ? "error" : ch.message_count + " msgs"}</span>
        </div>
        <a class="card-handle" href="https://t.me/${esc(ch.username)}" target="_blank" rel="noopener">@${esc(ch.username)} ↗</a>
        <div class="card-body">${esc(ch.summary)}</div>
        <div class="card-meta">Updated ${fmt(ch.updated_at)}</div>
      </div>`;
  }

  function esc(s) {
    return String(s ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  async function load() {
    try {
      const r = await fetch("summaries.json?_=" + Date.now());
      if (!r.ok) throw new Error("HTTP " + r.status);
      const data = await r.json();

      document.getElementById("loading").style.display = "none";

      if (!data.length) {
        document.getElementById("empty").style.display = "block";
        document.getElementById("meta").textContent = "No data yet";
        return;
      }

      const grid = document.getElementById("grid");
      grid.innerHTML = data.map(renderCard).join("");
      grid.style.display = "grid";

      const latest = data.reduce((a, b) =>
        (a.updated_at > b.updated_at ? a : b), data[0]);
      document.getElementById("meta").textContent =
        "Last updated: " + fmt(latest.updated_at);

    } catch (e) {
      document.getElementById("loading").style.display = "none";
      const el = document.getElementById("error-msg");
      el.style.display = "block";
      el.textContent = "Could not load summaries: " + e.message;
      document.getElementById("meta").textContent = "Error";
    }
  }

  load();
  setInterval(load, REFRESH_MS);
</script>

</body>
</html>
