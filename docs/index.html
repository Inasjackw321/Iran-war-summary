<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iran War — Live Intelligence Summaries</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0b10;
      color: #e2e8f0;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #0f1018;
      border-bottom: 1px solid #1e2030;
      padding: 0.9rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left { display: flex; flex-direction: column; gap: 0.15rem; }

    header h1 {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ef4444;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .header-sub {
      font-size: 0.72rem;
      color: #475569;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.15rem; }

    #last-updated { font-size: 0.72rem; color: #475569; }

    #countdown-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
    }

    #countdown-wrap .label { color: #475569; }

    #countdown {
      font-family: "Courier New", monospace;
      font-size: 0.85rem;
      font-weight: 700;
      color: #f97316;
      background: #1a0f00;
      border: 1px solid #7c2d1244;
      padding: 0.15em 0.5em;
      border-radius: 4px;
      min-width: 3.5rem;
      text-align: center;
    }

    /* ── Live dot ── */
    .live-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.4; transform: scale(1.4); }
    }

    /* ── Main ── */
    main {
      max-width: 1140px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    #loading {
      text-align: center;
      padding: 5rem;
      color: #475569;
      font-size: 1rem;
    }

    #error-msg {
      display: none;
      background: #200808;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      border-radius: 10px;
      padding: 1.25rem;
    }

    .setup-notice {
      background: #0f1a2e;
      border: 1px solid #1e3a5f;
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      color: #93c5fd;
      font-size: 0.85rem;
      line-height: 1.65;
    }

    .setup-notice strong { color: #60a5fa; }

    /* ── Cards ── */
    .card {
      background: #111219;
      border: 1px solid #1e2030;
      border-radius: 14px;
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      border-color: #dc2626;
      box-shadow: 0 0 0 1px #dc262622, 0 8px 32px #00000066;
    }

    .card:first-child {
      border-color: #7f1d1d;
      background: linear-gradient(135deg, #1a0b0b 0%, #111219 65%);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .card-title {
      font-weight: 700;
      font-size: 1.1rem;
      color: #fca5a5;
      display: block;
      margin-bottom: 0.2rem;
    }

    .card-handle { font-size: 0.74rem; color: #475569; text-decoration: none; }
    .card-handle:hover { color: #ef4444; text-decoration: underline; }

    .card-badges { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }

    .badge {
      display: inline-block;
      font-size: 0.66rem;
      padding: 0.25em 0.65em;
      border-radius: 9999px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .badge-ok  { background: #14532d44; color: #86efac; border: 1px solid #16a34a44; }
    .badge-err { background: #450a0a44; color: #fca5a5; border: 1px solid #b91c1c44; }

    /* ── Card content ── */
    .card-content { display: flex; gap: 1.75rem; align-items: flex-start; }

    .card-summary {
      flex: 1 1 0;
      font-size: 0.875rem;
      line-height: 1.8;
      color: #cbd5e1;
      white-space: pre-wrap;
      min-width: 0;
    }

    .card-charts {
      flex: 0 0 260px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .chart-block {
      background: #0a0b10;
      border: 1px solid #1a1c2a;
      border-radius: 10px;
      padding: 0.9rem;
    }

    .chart-label {
      font-size: 0.63rem;
      font-weight: 700;
      color: #374151;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.6rem;
    }

    .card-meta { font-size: 0.68rem; color: #2d3748; }

    .empty { text-align: center; padding: 5rem; color: #374151; }

    @media (max-width: 720px) {
      .card-content { flex-direction: column; }
      .card-charts { flex: none; width: 100%; }
      header { padding: 0.75rem 1rem; }
      .header-right { align-items: flex-start; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1><span class="live-dot"></span> Iran War — Live Summaries</h1>
    <span class="header-sub">AI-powered intelligence from Telegram · Updates every 30 min</span>
  </div>
  <div class="header-right">
    <span id="last-updated">Loading…</span>
    <div id="countdown-wrap">
      <span class="label">Next update in</span>
      <span id="countdown">--:--</span>
    </div>
  </div>
</header>

<main>
  <div id="error-msg"></div>
  <div id="loading">Fetching intelligence summaries…</div>
  <div id="cards"></div>
  <div class="empty" id="empty" style="display:none">
    No summaries yet.<br><br>
    Go to your GitHub repo → <strong>Actions</strong> → <strong>Summarize Channels</strong> → <strong>Run workflow</strong>
    to generate the first summaries.
  </div>
</main>

<script>
  const REFRESH_MS   = 30 * 60 * 1000;
  const CHART_COLORS = ['#ef4444','#f97316','#eab308','#22c55e','#3b82f6','#a855f7','#ec4899'];
  const chartInst    = {};
  let nextUpdateAt   = null;

  /* ── Countdown ── */
  function startCountdown(updatedAt) {
    nextUpdateAt = new Date(updatedAt).getTime() + REFRESH_MS;
    tickCountdown();
  }

  function tickCountdown() {
    const el = document.getElementById("countdown");
    if (!el || !nextUpdateAt) return;
    const remaining = Math.max(0, nextUpdateAt - Date.now());
    const m = Math.floor(remaining / 60000);
    const s = Math.floor((remaining % 60000) / 1000);
    el.textContent = `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  }
  setInterval(tickCountdown, 1000);

  /* ── Helpers ── */
  function fmt(iso) {
    if (!iso) return "—";
    return new Date(iso).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
  }

  function esc(s) {
    return String(s ?? "")
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function toneBadge(tone) {
    if (!tone) return "";
    const map = { positive:"#22c55e", negative:"#ef4444", neutral:"#94a3b8", mixed:"#f97316" };
    const c = map[tone] || "#94a3b8";
    return `<span class="badge" style="background:${c}18;color:${c};border:1px solid ${c}33">${esc(tone)}</span>`;
  }

  /* ── Render ── */
  function renderCard(ch, idx) {
    const err = ch.error;
    const hasActivity = !err && Array.isArray(ch.hourly_counts);
    const hasTopics   = !err && ch.topics && ch.topics.length > 0;

    return `
      <div class="card">
        <div class="card-header">
          <div>
            <span class="card-title">${esc(ch.display_name)}</span>
            <a class="card-handle" href="https://t.me/${esc(ch.username)}" target="_blank" rel="noopener">
              @${esc(ch.username)} ↗
            </a>
          </div>
          <div class="card-badges">
            <span class="badge ${err ? "badge-err" : "badge-ok"}">${err ? "error" : ch.message_count + " msgs"}</span>
            ${toneBadge(ch.tone)}
          </div>
        </div>

        <div class="card-content">
          <div class="card-summary">${esc(ch.summary)}</div>
          ${hasActivity ? `
          <div class="card-charts">
            <div class="chart-block">
              <div class="chart-label">Message Activity — 24 h</div>
              <canvas id="bar-${idx}"></canvas>
            </div>
            ${hasTopics ? `
            <div class="chart-block">
              <div class="chart-label">Topic Breakdown</div>
              <canvas id="pie-${idx}"></canvas>
            </div>` : ""}
          </div>` : ""}
        </div>

        <div class="card-meta">Summarised at ${fmt(ch.updated_at)}</div>
      </div>`;
  }

  /* ── Charts ── */
  function initCharts(data) {
    data.forEach((ch, idx) => {
      if (ch.error) return;
      ["bar","pie"].forEach(t => {
        const k = `${t}-${idx}`;
        if (chartInst[k]) { chartInst[k].destroy(); delete chartInst[k]; }
      });

      const barEl = document.getElementById(`bar-${idx}`);
      if (barEl && ch.hourly_counts) {
        chartInst[`bar-${idx}`] = new Chart(barEl, {
          type: "bar",
          data: {
            labels: ch.hourly_labels || [],
            datasets: [{
              data: ch.hourly_counts,
              backgroundColor: "#ef444433",
              borderColor: "#ef4444",
              borderWidth: 1,
              borderRadius: 3,
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { display: false },
              tooltip: { callbacks: { label: i => i.raw + " msgs" } }
            },
            scales: {
              x: { ticks: { color:"#374151", maxTicksLimit:6, font:{size:8} }, grid:{color:"#14151f"} },
              y: { ticks: { color:"#374151", font:{size:8} }, grid:{color:"#14151f"}, beginAtZero:true }
            }
          }
        });
      }

      const pieEl = document.getElementById(`pie-${idx}`);
      if (pieEl && ch.topics && ch.topics.length) {
        chartInst[`pie-${idx}`] = new Chart(pieEl, {
          type: "doughnut",
          data: {
            labels: ch.topics.map(t => t.label),
            datasets: [{
              data: ch.topics.map(t => t.score),
              backgroundColor: CHART_COLORS.slice(0, ch.topics.length),
              borderColor: "#0a0b10",
              borderWidth: 2,
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: {
                position: "bottom",
                labels: { color:"#6b7280", font:{size:9}, boxWidth:10, padding:6 }
              },
              tooltip: { callbacks: { label: i => `${i.label}: ${i.raw}%` } }
            },
            cutout: "58%"
          }
        });
      }
    });
  }

  /* ── Load ── */
  async function load() {
    try {
      const r = await fetch("summaries.json?_=" + Date.now());
      if (!r.ok) throw new Error("HTTP " + r.status);
      const data = await r.json();

      document.getElementById("loading").style.display = "none";

      if (!data.length) {
        document.getElementById("empty").style.display = "block";
        document.getElementById("last-updated").textContent = "No data yet";
        return;
      }

      document.getElementById("empty").style.display = "none";
      document.getElementById("cards").innerHTML = data.map(renderCard).join("");
      initCharts(data);

      const latest = data.reduce((a, b) => a.updated_at > b.updated_at ? a : b, data[0]);
      document.getElementById("last-updated").textContent = "Last updated: " + fmt(latest.updated_at);
      startCountdown(latest.updated_at);

    } catch (e) {
      document.getElementById("loading").style.display = "none";
      const el = document.getElementById("error-msg");
      el.style.display = "block";
      el.textContent = "Could not load summaries: " + e.message;
      document.getElementById("last-updated").textContent = "Error";
    }
  }

  load();
  setInterval(load, REFRESH_MS);
</script>

</body>
</html>
